name: PHANTOM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y binutils make python3
      - name: Build
        run: make clean all
      - name: Verify static Assembly executable
        run: make check
      - name: Run regression suite
        run: make test
